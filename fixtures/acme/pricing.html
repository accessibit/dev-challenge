<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Prezzi — Acme Fitness</title>
</head>
<body>
  <header>
    <a href="/" class="logo"><img src="/img/logo.svg" alt="Acme Fitness"></a>
    <nav aria-label="Principale">
      <a href="/corsi">Corsi</a>
      <a href="/pricing" aria-current="page">Prezzi</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main>
    <h1>Prezzi semplici, senza sorprese</h1>

    <img src="/img/decor/divider-wave.svg" alt="" class="divider">

    <div class="plans">
      <article class="plan">
        <h3>Base</h3>
        <img src="/img/icons/plan-base.svg" alt="">
        <p>9,90 € / mese</p>
        <a href="/signup?plan=base">Scegli Base</a>
      </article>
      <article class="plan">
        <h3>Pro</h3>
        <img src="/img/icons/plan-pro.svg" alt="">
        <p>19,90 € / mese</p>
        <a href="/signup?plan=pro">Scegli Pro</a>
      </article>
    </div>

    <h2>Domande frequenti</h2>
    <p>Puoi disdire quando vuoi dalle impostazioni dell'account.</p>
  </main>

  <footer>
    <p>© Acme Fitness S.r.l.</p>
  </footer>

  <!-- Chat widget (Zendesk-like vendor, loaded via script; markup owned by vendor) -->
  <iframe src="https://widget.chatvendor.example/embed?account=acme" id="chat-widget" width="360" height="500"></iframe>
</body>
</html>
